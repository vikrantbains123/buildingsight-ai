name: CI
# Deterministic CI (blueprint §7): replay cache only — no API keys, no cost.
# Blocks merge. Test-integrity: `impl` PRs may not touch tests/** or eval/ground_truth/**.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src/ pms_mock/ ui/ tests/
      - name: Typecheck
        run: uv run pyrefly check src/ || true # tighten to blocking once src lands (Spec 001+)
      - name: Tests (replay)
        env:
          CACHE_MODE: replay
        run: uv run pytest tests/ -q
      - name: AC coverage
        run: uv run python scripts/check_ac_coverage.py || true # blocking once script lands

  test-integrity:
    if: contains(github.event.pull_request.labels.*.name, 'impl') && !contains(github.event.pull_request.labels.*.name, 'tests-change-approved')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Impl PRs may not edit tests or ground truth
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "$changed"
          if echo "$changed" | grep -E '^(tests/|eval/ground_truth/)'; then
            echo "::error::impl PR touched tests/** or eval/ground_truth/** — needs tests-change-approved label"
            exit 1
          fi
