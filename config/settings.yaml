# BuildingSight AI — runtime settings (Specs 002–006)
# Model IDs: confirm on Day 0 spike; env vars in .env take precedence.

models:
  scene_analyst: muse-spark-1.1      # Muse Spark (vision) — keyframes → observations
  issue_extractor: muse-spark-1.1    # Muse Spark — observations → issues
  duplicate_checker: muse-wonder     # Muse Wonder — create-vs-update judgment (tool calls to PMS)
  work_order_writer: muse-spark-1.1  # Muse Spark — issue → work-order text
  judge: muse-wonder                 # Muse Wonder — LLM-as-judge for evals
  sam: sam-3.1                       # SAM 3.1 — text-prompted segmentation + video tracking
  transcribe: muse-voice-transcribe  # Muse Voice Transcribe — timestamped speech-to-text

ingest:
  keyframe_interval_sec: 2.0
  max_duration_sec: 300
  max_file_size_mb: 500
  allowed_extensions: [".mp4", ".mov"]

perception:
  sam_confidence_threshold: 0.5
  blur_people: true                  # privacy by default — never disable for saved evidence

agents:
  low_confidence_threshold: 0.6      # below → needs_review, never auto-filed
  max_retries_per_step: 2

orchestrator:
  step_timeout_sec: 120
  max_total_tokens_per_run: 200000   # cost cap — test_budget_exceeded_aborts
  max_model_calls_per_run: 50
  end_to_end_latency_target_sec: 180 # 60s video ≤ 3 min (eval gate)

executor:
  dry_run_default: true              # writes require explicit approval + hash check
