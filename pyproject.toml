[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buildingsight-ai"
version = "0.1.0"
description = "Multimodal AI-powered property inspections using Meta SAM 3.1, Muse Spark, and agentic workflows to automate maintenance work orders."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.4",
    "pyrefly>=0.10",
    "pre-commit>=3.7",
    "schemathesis>=3.30",
]
ui = [
    "streamlit>=1.35",
    "opencv-python>=4.9",
    "Pillow>=10.0",
]

[project.scripts]
buildingsight = "buildingsight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/buildingsight"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyrefly]
python-version = "3.11"
search-path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ac(id): acceptance criterion ID covered by this test, e.g. AC-001-01",
]
addopts = "-q"
